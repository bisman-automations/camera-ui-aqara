# Weekly update PRs for the GitHub Actions and npm packages used here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Major TypeScript releases wait until typescript-eslint supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Type definitions follow the Node.js version in "engines", not the newest Node.js.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        dependency-type: "development"
        patterns: ["*"]
      runtime:
        dependency-type: "production"
        patterns: ["*"]
