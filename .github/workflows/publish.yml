# Publishes the package to npm when Donavan publishes a GitHub release.
#
# The tag must match package.json's version and CHANGELOG.md, and be on main.
# If this fails, fix it with a new patch release, never by moving the tag.
#
# npm auth: add an NPM_TOKEN repository secret (an npm automation token), or
# set up trusted publishing for this repository on npmjs.com, which needs no
# secret.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag against package.json, CHANGELOG.md and main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          grep -q "^## \[${version}\] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::${TAG} is not on main"; exit 1; }

      - run: npm ci
      - run: npm run bundle

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then channel=--beta; else channel=--latest; fi
          SAFE_PUBLISH=1 npx cui publish "$channel" --yes --provenance
