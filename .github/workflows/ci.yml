# Format, lint, type-check, test and bundle on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version matches between package.json and CHANGELOG.md
        run: |
          version=$(node -p "require('./package.json').version")
          grep -q "^## \[${version}\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' heading for package.json's version"
            exit 1
          }
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md must not have an [Unreleased] section; write the notes under the release heading"
            exit 1
          fi
      - run: npm run bundle
